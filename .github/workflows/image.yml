name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write     # lets GITHUB_TOKEN push to this repo's GHCR
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Both, so the image runs on an amd64 cluster and on an Apple Silicon
          # laptop. Nothing is compiled here, so emulation costs almost nothing.
          platforms: linux/amd64,linux/arm64
          # Literal, not ${{ github.repository }}: that expands to
          # Magier/ikt26 and Docker rejects uppercase in a repository name.
          tags: ghcr.io/magier/ikt26/netshoot-console:latest
