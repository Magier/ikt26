# Build the review agent image and publish it to this repository's GHCR.
#
# WHY THIS LIVES ON THE `lab-infra` BRANCH
#
# The image needs agent/reviewagent/, hack/build-pr-repo.sh and workshop-repo/.
# None of those exist on `main` or on the pull request branch, and they must not:
# those two branches are the *story* - a payments-api service and one malicious
# skill - and hack/publish-pr-repo.sh regenerates them from workshop-repo/ and
# FORCE-PUSHES on every run. A workflow committed there would be destroyed on the
# next publish, and until then it would sit in the diff participants are asked to
# review, telling them the repository is a workshop prop.
#
# So the management tree lives on its own branch. publish-pr-repo.sh pushes only
# refs/heads/main and refs/heads/feat/agent-skill-k8s-review, so `lab-infra` is
# never touched by a story reset - and the GHCR package still belongs to this
# repository, which is what "host the image in the repo" asks for.
name: agent image

on:
  push:
    branches: [lab-infra]
    paths:
      - 'agent/**'
      - 'workshop-repo/**'
      - 'hack/build-pr-repo.sh'
      - '.github/workflows/agent-image.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}/review-agent

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The only elevated grant. GITHUB_TOKEN with packages:write can push to
      # this repository's GHCR namespace, so no personal access token and no
      # repository secret is involved.
      packages: write

    steps:
      - uses: actions/checkout@v4

      # The history baked into the image. Fixed authors and fixed commit dates,
      # so this layer is byte-identical here and on a laptop - a participant can
      # rebuild it and get the same digest.
      - name: Generate the repository under review
        run: hack/build-pr-repo.sh

      # arm64 is emulated. The image adds no compiled code - the base carries
      # python3 and git already - so the emulated steps are adduser and chown.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      # Both architectures: the workshop is run from Apple Silicon laptops and
      # deployed to amd64 clusters, and a manifest that covers only one of them
      # fails at `kubectl apply` time rather than at build time.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves the thing that was unverifiable before: that the image starts,
      # that python3 is really in the base, and that the agent serves. Runs the
      # native amd64 image straight from the registry.
      - name: Smoke-test the published image
        run: |
          set -eux
          docker run -d --name agent -p 8080:8080 \
            -e KUBE_BACKEND=none "${IMAGE}:latest"
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz && break || sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz | tee /dev/stderr | grep -q '"status": "ok"'
          curl -fsS http://127.0.0.1:8080/skills | tee /dev/stderr | grep -q 'k8s-review'
          docker exec agent id | grep -q 'uid=10001'
          docker rm -f agent

      - name: Summary
        run: |
          {
            echo "### Published"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "Pull: \`docker pull ${IMAGE}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
