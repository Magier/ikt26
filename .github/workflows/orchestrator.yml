name: orchestrator

on:
  push:
    branches: [main]
    paths:
      - 'orchestrator/**'
      - '.github/workflows/orchestrator.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write     # lets GITHUB_TOKEN push to this repo's GHCR
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./orchestrator
          push: true
          # Both arches, like the netshoot console: this is pure-Python, so
          # emulation compiles nothing and costs almost nothing.
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/magier/ikt26/agent-orchestrator:latest

      # It imports nothing outside the standard library, so "it imports" is a
      # real smoke test that the image can start rather than crashloop. The
      # distroless base has python3 as its ENTRYPOINT, so pass just the args.
      - name: smoke test - the server imports and is syntactically sound
        run: |
          docker run --rm ghcr.io/magier/ikt26/agent-orchestrator:latest \
            -c "import ast; ast.parse(open('/app/server.py').read()); print('ok')"
