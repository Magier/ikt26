# The agent platform: an orchestrator that spawns ephemeral worker pods.
#
#   kubectl apply -f k8s/orchestrator.yaml
#
# This is the escalation target of the workshop, so read the RBAC below with
# that in mind. Nothing here is exotic - it is what a real task-runner platform
# looks like. The lesson is that "realistic" and "dangerous" are the same object.
#
#   agent-orchestrator  (SA)  -> can create pods in this namespace. Legitimate:
#                                its whole job is creating worker pods.
#   agent-worker        (SA)  -> no RBAC at all. A worker that abuses its own
#                                identity gets nowhere; that is deliberate.
#
# Whoever holds the orchestrator's token can create a pod - and a pod they
# control can be a privileged, hostPath pod, which is root on the node. The
# create-pods verb is the whole escalation. See docs once the attack lands.
apiVersion: v1
kind: Namespace
metadata:
  name: agent-system
  labels:
    name: agent-system
---
# The workers' identity. No Role is bound to it: workers are meant to be boxed
# in, so the initial foothold has nowhere to go on its own credentials.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-worker
  namespace: agent-system
---
# The orchestrator's identity - the one worth stealing.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-orchestrator
  namespace: agent-system
---
# Namespaced, not cluster-wide, and only the verbs a pod-spawner actually uses.
# This is a defensible Role a reviewer would wave through - which is exactly why
# it makes such a clean escalation once the identity is compromised.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-orchestrator
  namespace: agent-system
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-orchestrator
  namespace: agent-system
subjects:
  - kind: ServiceAccount
    name: agent-orchestrator
    namespace: agent-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-orchestrator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-orchestrator
  namespace: agent-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: agent-orchestrator}
  template:
    metadata:
      labels: {app: agent-orchestrator}
    spec:
      serviceAccountName: agent-orchestrator
      # GHCR packages are private by default even from a public repo. Flip the
      # package to public, or add an imagePullSecret here and on the workers'
      # namespace, or the pods sit in ImagePullBackOff. Same note as agentbox.
      #
      # Two containers, one pod, one ServiceAccount token shared between them -
      # and that shared token is the whole lesson:
      #
      #   orchestrator   hardened. distroless (no shell), read-only root,
      #                  nonroot, no capabilities. No exec surface to attack.
      #   debug-sidecar  soft. root, a full toolbox, an unauthenticated command
      #                  endpoint. The way in that the hardening above cannot
      #                  stop, because both containers mount the same token.
      #
      # Harden one container all you like; the sidecar next to it still holds
      # the pod's identity.
      containers:
        - name: orchestrator
          image: ghcr.io/magier/ikt26/agent-orchestrator:latest
          imagePullPolicy: Always
          ports:
            - {name: http, containerPort: 8080}
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
            - name: POD_NAME
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
            # One worker by default - the playground nodes are 4G and each
            # worker is a full agentbox image.
            - {name: WORKER_REPLICAS, value: "1"}
            # The coordination backend. Points at the Redis in this namespace;
            # the loop degrades gracefully if it is not deployed.
            - {name: REDIS_HOST, value: "redis.agent-system.svc"}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
        # The soft underbelly - a "debug / telemetry" sidecar (the netshoot
        # console) shipped alongside the orchestrator "for troubleshooting".
        # Root, full toolbox, and an unauthenticated command endpoint on
        # /api/run. It shares this pod's ServiceAccount token and network
        # identity, so reaching it *is* becoming the orchestrator.
        #
        # The unauth exec endpoint is a deliberate stand-in for the class of
        # "vendor debug/support sidecar with a sloppy interface" - the honest
        # shortcut is called out in the instructor notes. No securityContext, on
        # purpose: it is the contrast to the block above. Bound to 8099 because
        # it shares the pod's network namespace with the orchestrator on 8080.
        - name: debug-sidecar
          image: ghcr.io/magier/ikt26/netshoot-console:latest
          imagePullPolicy: Always
          env:
            - {name: PORT, value: "8099"}
          ports:
            - {name: debug, containerPort: 8099}
          readinessProbe:
            httpGet: {path: /healthz, port: debug}
            initialDelaySeconds: 2
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: agent-orchestrator
  namespace: agent-system
spec:
  selector: {app: agent-orchestrator}
  ports:
    - {name: http, port: 80, targetPort: http}
    # The debug sidecar, reachable in-cluster - this is the port an attacker in
    # a worker pivots to. A "debug" port exposed on the Service is exactly the
    # kind of thing that ships by accident.
    - {name: debug, port: 8099, targetPort: debug}
