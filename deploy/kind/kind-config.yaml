# A kind cluster with API server auditing enabled, for running the workshop
# locally. Create with:
#
#   mkdir -p /tmp/kind-audit
#   kind create cluster --name ikt-workshop --config deploy/kind/kind-config.yaml
#
# Audit log then lands at /tmp/kind-audit/audit.log on the host.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ikt-workshop
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            audit-policy-file: /etc/kubernetes/audit/audit-policy.yaml
            audit-log-path: /var/log/kubernetes/audit.log
            audit-log-maxage: "7"
            audit-log-maxbackup: "2"
          extraVolumes:
            - name: audit-policy
              hostPath: /etc/kubernetes/audit
              mountPath: /etc/kubernetes/audit
              readOnly: true
              pathType: DirectoryOrCreate
            - name: audit-log
              hostPath: /var/log/kubernetes
              mountPath: /var/log/kubernetes
              readOnly: false
              pathType: DirectoryOrCreate
    extraMounts:
      - hostPath: ./deploy/kind
        containerPath: /etc/kubernetes/audit
        readOnly: true
      - hostPath: /tmp/kind-audit
        containerPath: /var/log/kubernetes
