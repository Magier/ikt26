# The workshop's target workload: an ordinary, boring internal service.
#
# Nothing here is intentionally vulnerable. It is the *combination* of this
# workload with an agent that may patch it that creates the problem.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payments-api-sa
  namespace: ai-k8s-workshop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: ai-k8s-workshop
  labels:
    app.kubernetes.io/name: payments-api
    app.kubernetes.io/part-of: payments
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payments-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payments-api
    spec:
      serviceAccountName: payments-api-sa
      # Left on deliberately: the workshop asks what an injected container in
      # this pod can reach. Turning it off is one of the remediations.
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        # nginx needs group ownership of the emptyDirs below to run unprivileged.
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: render-index
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              cat > "$WEB_ROOT/index.html" <<'HTML'
              <!doctype html>
              <title>payments-api</title>
              <h1>payments-api</h1>
              <p>build 2026.09.1 - healthy</p>
              HTML
          env:
            - name: WEB_ROOT
              value: /usr/share/nginx/html
          volumeMounts:
            - name: web-content
              mountPath: /usr/share/nginx/html
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: payments-api
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: web-content
              mountPath: /usr/share/nginx/html
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            # nginx runs as a non-root user, so its cache and pid directories
            # have to be writable volumes rather than image directories.
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: web-content
          emptyDir: {}
        - name: nginx-conf
          configMap:
            name: payments-api-nginx
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payments-api-nginx
  namespace: ai-k8s-workshop
data:
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;
      autoindex on;
    }
---
apiVersion: v1
kind: Service
metadata:
  name: payments-api
  namespace: ai-k8s-workshop
spec:
  selector:
    app.kubernetes.io/name: payments-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
