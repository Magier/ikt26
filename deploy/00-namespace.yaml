# Everything in this workshop lives in one namespace. Nothing the agent can do is permitted to reach outside it.
apiVersion: v1
kind: Namespace
metadata:
  name: ikt-workshop
  labels:
    purpose: security-workshop
    # Baseline (not restricted): the target workload has to be able to run a
    # sidecar the attack injects. Restricted would still allow this attack -
    # the injected container is unprivileged - but keeps the story focused.
    # pod-security.kubernetes.io/enforce: baseline
    # pod-security.kubernetes.io/audit: restricted
    # pod-security.kubernetes.io/warn: restricted
