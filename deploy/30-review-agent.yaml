apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-pr-review-agent
  namespace: ikt-workshop
  labels:
    app.kubernetes.io/name: ai-pr-review-agent
    app.kubernetes.io/part-of: platform-tooling
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-pr-review-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-pr-review-agent
    spec:
      serviceAccountName: review-agent-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        # The audit-log emptyDir is created root-owned; without fsGroup the
        # non-root agent cannot write its own evidence.
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          # Built from agent/Dockerfile by .github/workflows/agent-image.yml and
          # published to this repository's GHCR. Still a netshoot base, so
          # `kubectl exec` into this pod keeps curl, nmap, tcpdump and tshark -
          # but the container now runs the agent instead of sleeping.
          #
          # `:latest` with Always so re-running the lab picks up a rebuild
          # without editing a manifest. Pin the digest for a workshop you need
          # to be reproducible months later:
          #   image: ghcr.io/magier/ikt26/review-agent@sha256:...
          image: ghcr.io/magier/ikt26/review-agent:latest
          imagePullPolicy: Always
          # No command/args override. The image sets
          # ENTRYPOINT ["python3","-m","reviewagent.cli"] and CMD ["serve"],
          # which replaces the `/bin/sh -c "sleep infinity & wait"` workaround
          # netshoot's bare CMD used to require.
          env:
            # /root is not writable: readOnlyRootFilesystem plus uid 10001.
            # Anything run by `kubectl exec` that wants a home - a shell, or
            # codex writing ~/.codex - needs this pointed at the writable
            # emptyDir instead.
            - name: HOME
              value: /tmp
            - name: KUBE_BACKEND
              value: cluster
            - name: WORKSHOP_REPO
              value: /workspace/workshop-repo
            - name: WORKSHOP_NAMESPACE
              value: ikt-workshop
            - name: AUDIT_LOG
              value: /var/log/review-agent/events.jsonl
            # Recorded in every evidence event so the audit log names the
            # identity the API calls were made with.
            - name: SERVICE_ACCOUNT_NAME
              value: review-agent-sa
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          # The agent serves here now, so the Service below finally points at
          # something listening rather than at a closed port.
          ports:
            - name: http
              containerPort: 8080
          # Restored along with `serve`. /healthz is a static handler that does
          # not touch the Kubernetes API, so a probe failure means the process
          # is wedged - not that RBAC is denying it something.
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          # securityContext: 
            # allowPrivilegeEscalation: true
            # readOnlyRootFilesystem: true
            # capabilities:
            #   drop: ["ALL"]
          volumeMounts:
            # The agent's own audit log. An emptyDir keeps phase 1 simple; it
            # also means the evidence dies with the pod, which is itself a
            # finding participants should report.
            - name: audit
              mountPath: /var/log/review-agent
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: audit
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-pr-review-agent
  namespace: ikt-workshop
spec:
  selector:
    app.kubernetes.io/name: ai-pr-review-agent
  ports:
    - name: http
      port: 80
      targetPort: http
