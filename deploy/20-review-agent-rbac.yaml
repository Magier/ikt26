# ---------------------------------------------------------------------------
# The review agent's identity and permissions.
#
# This RBAC is the heart of the workshop. Every rule below is one a platform
# team could plausibly justify for an agent that reviews Kubernetes manifests,
# and the set as a whole is still enough to turn "review" into "execute".
#
# Deliberately absent:
#   * cluster-admin, and any ClusterRole at all - the Role is namespaced
#   * secrets (get/list) - so the workshop cannot become credential theft
#   * pods/exec, pods/attach, pods/portforward - the attack needs none of them,
#     which is the point: blocking exec does not block code execution
#   * serviceaccounts/token - no token minting
#   * anything in kube-system or cluster scope
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: review-agent-sa
  namespace: ikt-workshop
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: review-agent
  namespace: ikt-workshop
rules:
  # WHY: the review reports "the live workload does not match deploy/", so the
  # agent has to be able to read what is actually running.
  # COST: discloses the full pod spec of every workload to model context.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]

  # WHY: reviews quote crash loops and startup errors back at the PR author.
  # COST: container logs are an uncontrolled data source flowing into the model.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]

  # WHY: manifests under review are Deployments; the agent compares them with
  # the live objects and reports drift.
  # COST (read): none serious.
  # COST (patch): *** this is the review -> execution boundary ***
  #   Patching spec.template is arbitrary code execution in the workload:
  #   the patcher chooses the image, the command and the mounts, and the
  #   kubelet runs them. No exec permission is involved.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]

  # WHY: the agent explains a rollout's revision history when reporting drift.
  # COST: read-only.
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]

  # WHY: manifests reference ConfigMaps; the review checks they exist.
  # COST: read-only, and ConfigMaps in this namespace hold no secrets.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]

  # WHY: the agent posts its own progress as Kubernetes Events so operators can
  # see review activity with kubectl. This is also workshop evidence.
  # COST: an attacker in the agent's identity can write misleading Events.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]

  # WHY: originally added so the agent could run a throwaway "manifest lint"
  # pod for PRs. Nothing uses it any more.
  # COST: a second, blunter path to the same code execution. The attack in this
  #   workshop deliberately does NOT use it - stale permissions are usually
  #   more dangerous than the ones in active use, and participants should find
  #   this rule while investigating even though it was not the vector.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: review-agent
  namespace: ikt-workshop
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: review-agent
subjects:
  - kind: ServiceAccount
    name: review-agent-sa
    namespace: ikt-workshop
